services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sessions
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/sessions
    volumes:
      - ./backend:/app

  client:
    build: ./client
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000
    profiles: ["simulator"]
    command: ["--scenario", "${SCENARIO:-happy_path}", "--api-url", "http://backend:8000", "--speed", "${SPEED:-10}"]

volumes:
  postgres_data:
